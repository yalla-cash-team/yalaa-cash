name: yalla_cash_customer
description: Customer mobile app for Yalla Cash.
version: 1.1.0+14
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  qr_flutter: ^4.1.0
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  google_sign_in: ^6.2.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  firebase_messaging: ^15.0.0
  yalla_cash_core:
    path: ../../packages/yalla_cash_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # Customer-only Arabic typeface: the complete Almarai family (SIL Open Font
  # License 1.1, see assets/fonts/OFL.txt), from the official Google Fonts
  # repository. Admin and merchant keep the shared core font unchanged.
  fonts:
    - family: Almarai
      fonts:
        - asset: assets/fonts/Almarai-Light.ttf
          weight: 300
        - asset: assets/fonts/Almarai-Regular.ttf
          weight: 400
        - asset: assets/fonts/Almarai-Bold.ttf
          weight: 700
        - asset: assets/fonts/Almarai-ExtraBold.ttf
          weight: 800
